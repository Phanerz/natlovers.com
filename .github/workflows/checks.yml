name: Checks

# Runs on every pull request and every push to main: the same two checks done by hand
# before each commit (typecheck and production build). It uses placeholder values, never
# real secrets, and never touches the database.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DB_POSTGRES_URL: postgres://ci:ci@127.0.0.1:5432/ci
      NEXTAUTH_SECRET: ci-placeholder-secret
      NEXTAUTH_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ci-placeholder
      GOOGLE_CLIENT_SECRET: ci-placeholder
      ADMIN_EMAILS: ci@example.com
      NATLOVERS_READ_WRITE_TOKEN: ci-placeholder
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Production build
        run: npx next build
      - name: Known vulnerabilities in what ships to customers (report only)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
