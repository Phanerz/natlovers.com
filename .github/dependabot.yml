# A quiet weekly check for newer versions of what the site is built on. Each week at most
# one grouped pull request is opened for small updates; the checks workflow tests it, and
# nothing merges without being looked at.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      small-updates:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
